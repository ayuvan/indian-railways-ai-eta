<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="100%" height="100%">
  <defs>
    <linearGradient id="wagGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="50%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="wagTiger" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="freightGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Heavy Co-Co High Adhesion Freight Bogies -->
  <g fill="#111827" stroke="#374151" stroke-width="2">
    <!-- Front Bogie -->
    <rect x="35" y="116" width="125" height="12" rx="3" fill="#030712"/>
    <circle cx="50" cy="132" r="14"/><circle cx="50" cy="132" r="6" fill="#9ca3af"/>
    <circle cx="95" cy="132" r="14"/><circle cx="95" cy="132" r="6" fill="#9ca3af"/>
    <circle cx="140" cy="132" r="14"/><circle cx="140" cy="132" r="6" fill="#9ca3af"/>
    <rect x="70" y="120" width="8" height="6" fill="#6b7280"/>
    <rect x="115" y="120" width="8" height="6" fill="#6b7280"/>

    <!-- Rear Bogie -->
    <rect x="240" y="116" width="125" height="12" rx="3" fill="#030712"/>
    <circle cx="255" cy="132" r="14"/><circle cx="255" cy="132" r="6" fill="#9ca3af"/>
    <circle cx="300" cy="132" r="14"/><circle cx="300" cy="132" r="6" fill="#9ca3af"/>
    <circle cx="345" cy="132" r="14"/><circle cx="345" cy="132" r="6" fill="#9ca3af"/>
    <rect x="275" y="120" width="8" height="6" fill="#6b7280"/>
    <rect x="320" y="120" width="8" height="6" fill="#6b7280"/>
  </g>

  <!-- Heavy Duty Frame -->
  <rect x="20" y="108" width="360" height="12" rx="2" fill="#1f2937" stroke="#374151" stroke-width="1.5"/>

  <!-- Cowcatcher with Yellow & Black Tiger Hazard Stripes -->
  <polygon points="12,126 22,108 28,126" fill="#f59e0b" stroke="#78350f" stroke-width="1"/>
  <polygon points="388,126 378,108 372,126" fill="#f59e0b" stroke="#78350f" stroke-width="1"/>

  <!-- Locomotive Superstructure (Deep Forest Green) -->
  <path d="M 22 108 
           L 30 65 
           Q 34 52 48 50 
           L 352 50 
           Q 366 52 370 65 
           L 378 108 Z" fill="url(#wagGreen)" stroke="#166534" stroke-width="1.5"/>

  <!-- Iconic Yellow Tiger Caution Band -->
  <path d="M 27 82 L 373 82 L 375 96 L 25 96 Z" fill="url(#wagTiger)"/>
  <!-- Tiger Chevron Stripes -->
  <g stroke="#1f2937" stroke-width="3">
    <line x1="30" y1="96" x2="42" y2="82"/>
    <line x1="45" y1="96" x2="57" y2="82"/>
    <line x1="60" y1="96" x2="72" y2="82"/>
    <line x1="330" y1="96" x2="342" y2="82"/>
    <line x1="345" y1="96" x2="357" y2="82"/>
    <line x1="360" y1="96" x2="372" y2="82"/>
  </g>

  <!-- Dual Windshields -->
  <polygon points="34,68 44,55 75,55 72,68" fill="#111827" stroke="#fbbf24" stroke-width="1"/>
  <polygon points="328,55 356,55 366,68 328,68" fill="#111827" stroke="#fbbf24" stroke-width="1"/>

  <!-- High-Capacity Air Intake Filtration Grids -->
  <g fill="#064e3b" stroke="#047857" stroke-width="0.8">
    <rect x="95" y="58" width="45" height="18" rx="2"/>
    <rect x="150" y="58" width="45" height="18" rx="2"/>
    <rect x="205" y="58" width="45" height="18" rx="2"/>
    <rect x="260" y="58" width="45" height="18" rx="2"/>
  </g>

  <!-- Heavy Traction 25kV Pantographs -->
  <path d="M 75 50 L 92 30 L 105 42 L 88 18 L 122 18" fill="none" stroke="#eab308" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 325 50 L 308 30 L 295 42 L 312 18 L 278 18" fill="none" stroke="#eab308" stroke-width="2.5" stroke-linecap="round"/>

  <!-- High-Power Twin Headlights -->
  <g filter="url(#freightGlow)">
    <circle cx="28" cy="74" r="5" fill="#fef08a"/>
    <circle cx="28" cy="74" r="2.5" fill="#ffffff"/>
    <circle cx="372" cy="74" r="5" fill="#ef4444"/>
  </g>

  <!-- Number Plate -->
  <rect x="155" y="85" width="90" height="18" rx="3" fill="#111827" stroke="#f59e0b" stroke-width="1"/>
  <text x="200" y="94" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="7" fill="#fef08a" text-anchor="middle">WAG-9 #31200</text>
  <text x="200" y="101" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="5" fill="#9ca3af" text-anchor="middle">TKD SHED • 6120 HP HEAVY HAUL</text>
</svg>
