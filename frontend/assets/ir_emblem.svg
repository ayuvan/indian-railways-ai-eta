<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="irGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="irRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
  </defs>

  <!-- Outer Cogwheel Ring (24 Teeth) -->
  <circle cx="80" cy="80" r="74" fill="none" stroke="url(#irGold)" stroke-width="4"/>
  <circle cx="80" cy="80" r="66" fill="url(#irRed)" stroke="url(#irGold)" stroke-width="2"/>

  <!-- Cog teeth -->
  <g fill="url(#irGold)">
    <circle cx="80" cy="6" r="3.5"/><circle cx="80" cy="154" r="3.5"/>
    <circle cx="6" cy="80" r="3.5"/><circle cx="154" cy="80" r="3.5"/>
    <circle cx="28" cy="28" r="3.5"/><circle cx="132" cy="132" r="3.5"/>
    <circle cx="28" cy="132" r="3.5"/><circle cx="132" cy="28" r="3.5"/>
  </g>

  <!-- Inner Concentric Railway Wheel -->
  <circle cx="80" cy="80" r="48" fill="#1e293b" stroke="url(#irGold)" stroke-width="3"/>

  <!-- Iconic Steam Engine Silhouette & Tracks -->
  <g fill="url(#irGold)">
    <!-- Rail Tracks Converging -->
    <polygon points="62,118 98,118 88,88 72,88"/>
    <!-- Sleepers -->
    <rect x="60" y="112" width="40" height="3" rx="1"/>
    <rect x="65" y="103" width="30" height="2.5" rx="1"/>
    <rect x="69" y="95" width="22" height="2" rx="1"/>

    <!-- Classic Steam Locomotive Face -->
    <circle cx="80" cy="68" r="16"/>
    <circle cx="80" cy="68" r="13" fill="#7f1d1d"/>
    <circle cx="80" cy="68" r="5" fill="url(#irGold)"/>
    <!-- Chimney & Dome -->
    <rect x="76" y="44" width="8" height="10" rx="1"/>
    <!-- Cowcatcher grill -->
    <polygon points="68,82 92,82 96,88 64,88"/>
  </g>

  <!-- Top Star / Ashoka Emblem Accent -->
  <polygon points="80,18 83,26 91,26 84,31 87,39 80,34 73,39 76,31 69,26 77,26" fill="url(#irGold)"/>

  <!-- Circular Text Ribbon -->
  <text x="80" y="142" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="7.5" fill="#fef08a" text-anchor="middle" letter-spacing="1.5">INDIAN RAILWAYS</text>
</svg>
